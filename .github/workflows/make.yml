name: Build and Release

on:
  - push

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Linux Software
        run: pnpm dist -l --x64

      - name: Upload Linux dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Uses -w (Windows) instead of -l (Linux)
      - name: Build Windows Software
        env:
          CL: /std:c++20
        run: pnpm dist -w --x64

      - name: Upload Windows dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Linux dist
        uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist-linux

      - name: Download Windows dist
        uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist-windows

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          # Using wildcards so you don't have to manually update the version number in the YAML
          files: |
            ./dist-linux/*.deb
            ./dist-linux/*.AppImage
            ./dist-windows/*.exe
