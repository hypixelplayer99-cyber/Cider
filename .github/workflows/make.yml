name: Build and Release

on:
  - push

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Linux Software
        run: pnpm dist -l --x64

      - name: Upload Linux dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # NEW STEP: Brute-force overwrite the binding.gyp file
      - name: Force C++20 in node-airtunes2
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let gypPath;
            try {
              // fs.realpathSync bypasses pnpm's virtual symlinks to find the physical file
              gypPath = fs.realpathSync('node_modules/node-airtunes2/binding.gyp');
            } catch (err) {
              console.error("CRITICAL ERROR: Could not find binding.gyp! The package didn't install correctly.");
              process.exit(1);
            }

            // We completely overwrite the file rather than trying to parse/edit it
            const gypContent = `{
              "targets": [
                {
                  "target_name": "airtunes",
                  "sources": [
                    "src/airtunes.cc",
                    "src/codec.cc"
                  ],
                  "include_dirs": [
                    "<!(node -e \\"require('nan')\\")"
                  ],
                  "cflags_cc": ["-std=c++20"],
                  "msvs_settings": {
                    "VCCLCompilerTool": {
                      "AdditionalOptions": ["/std:c++20"]
                    }
                  }
                }
              ]
            }`;

            fs.writeFileSync(gypPath, gypContent);
            console.log("SUCCESS: Brute-forced binding.gyp at " + gypPath);

      - name: Build Windows Software
        run: pnpm dist -w --x64

      - name: Upload Windows dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Linux dist
        uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist-linux

      - name: Download Windows dist
        uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist-windows

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist-linux/*.deb
            ./dist-linux/*.AppImage
            ./dist-windows/*.exe
