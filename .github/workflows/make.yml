name: Build and Release

on:
  - push

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Linux Software
        run: pnpm dist -l --x64

      - name: Upload Linux dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Uses -w (Windows) instead of -l (Linux)
      - name: Build Windows Software
        run: pnpm dist -w --x64

      - name: Upload Windows dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist

  build-flatpak:
    runs-on: ubuntu-latest
    needs: build-linux
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux dist
        uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist

      - name: Build Flatpak Package
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: sh.cider.Cider.flatpak
          manifest-path: flatpak/sh.cider.Cider.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: dist-flatpak
          path: sh.cider.Cider.flatpak

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-flatpak]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Linux dist
        uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist-linux

      - name: Download Windows dist
        uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist-windows

      - name: Download Flatpak
        uses: actions/download-artifact@v4
        with:
          name: dist-flatpak
          path: dist-flatpak

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          # Using wildcards so you don't have to manually update the version number in the YAML
          files: |
            ./dist-linux/*.deb
            ./dist-linux/*.AppImage
            ./dist-windows/*.exe
            ./dist-flatpak/sh.cider.Cider.flatpak
